<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GitHub PR Filter Counter</title>
    <style>
      body { font: 14px system-ui, sans-serif; padding: 16px; max-width: 520px; }
      input { width: 100%; padding: 6px; font-family: monospace; }
      button { margin-top: 8px; }
    </style>
  </head>
  <body>

    <span id="status"></span>
    <script src="options.js"></script>
  </body>
</html>
